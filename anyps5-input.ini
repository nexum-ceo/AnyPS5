# AnyPS5 Standard-Tastaturkonfiguration
# Format: Action = Type:Value
# Mehrere Eintraege pro Aktion = zusaetzliche Alternativtasten

# --- Buttons ---
Cross         = KEY:Return
Cross         = KEY:Space
Circle        = KEY:Backspace
Triangle      = KEY:Tab
Square        = KEY:E

L1            = KEY:Q
R1            = KEY:R
L2            = KEY:KP_7
R2            = MOUSE:Right
L3            = KEY:KP_0
R3            = KEY:KP_Period

Options       = KEY:Escape

# --- D-Pad ---
Up            = KEY:Up
Down          = KEY:Down
Left          = KEY:Left
Right         = KEY:Right

# --- Linker Stick (WASD) ---
LeftStickUp   = KEY:W
LeftStickDown = KEY:S
LeftStickLeft = KEY:A
LeftStickRight= KEY:D

# --- Rechter Stick (Maus oder Pfeiltasten via Numpad) ---
RightStickUp   = KEY:KP_8
RightStickDown = KEY:KP_2
RightStickLeft = KEY:KP_4
RightStickRight= KEY:KP_6

# --- Touchpad ---
TouchLeft     = MOUSE:Left
TouchRight    = MOUSE:Right

# --- Sonstiges ---
ToggleMouse      = MOUSE:Middle
ToggleFullscreen = KEY:F11
